<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home / Look Blog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Lexend:wght@900&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="home.css" />
</head>
<body class="app-body">
  <div class="app">
    <!-- Left: navigation -->
    <aside class="side-nav">
      <a href="#/" class="logo logo-app" aria-label="Look Blog home"><span aria-hidden="true">L<span class="eye"><span class="pupil"></span><span class="lid lid-top"></span><span class="lid lid-bottom"></span></span><span class="eye"><span class="pupil"></span><span class="lid lid-top"></span><span class="lid lid-bottom"></span></span>k <em>Blog</em></span></a>

      <nav class="nav-links">
        <a href="#/" class="nav-link" data-nav="home">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" /></svg>
          <span>Home</span>
        </a>
        <a href="#/" class="nav-link" data-nav="profile" id="navProfile">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4" /><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7" /></svg>
          <span>Profile</span>
        </a>
      </nav>

      <button class="btn btn-primary btn-full post-cta" id="postCta">Post</button>

      <div class="me-card">
        <span class="avatar" id="meAvatar"></span>
        <div class="me-text">
          <b id="meName"></b>
          <span id="meHandle"></span>
        </div>
        <button class="icon-btn" id="logoutBtn" title="Log out" aria-label="Log out">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4M10 17l5-5-5-5M15 12H4" /></svg>
        </button>
      </div>
    </aside>

    <!-- Middle: feed or profile -->
    <main class="column" id="column">
      <header class="column-head">
        <div class="head-row">
          <button class="icon-btn back-btn" id="backBtn" hidden aria-label="Back">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6" /></svg>
          </button>
          <h1 id="columnTitle">Home</h1>
        </div>
        <div class="tabs" id="tabs" role="tablist">
          <button class="tab" role="tab" data-scope="following">Following</button>
          <button class="tab" role="tab" data-scope="everyone">Everyone</button>
        </div>
      </header>

      <!-- Composer (home only) -->
      <form class="composer" id="composer" novalidate>
        <span class="avatar" id="composerAvatar"></span>
        <div class="composer-main">
          <label for="composerText" class="sr-only">Write a post</label>
          <textarea id="composerText" rows="2" placeholder="What did you see today?"></textarea>
          <div class="composer-bar">
            <span class="composer-hint">Ctrl + Enter to post</span>
            <span class="counter" id="counter"></span>
            <button type="submit" class="btn btn-primary btn-sm" id="postBtn" disabled>Post</button>
          </div>
          <p class="form-error" id="composerError" role="alert" hidden></p>
        </div>
      </form>

      <!-- Profile header (profile only) -->
      <section class="profile" id="profile" hidden>
        <div class="profile-banner"></div>
        <div class="profile-top">
          <span class="avatar avatar-xl" id="pAvatar"></span>
          <button class="btn btn-sm" id="followBtn" hidden></button>
        </div>
        <h2 id="pName"></h2>
        <p class="handle" id="pHandle"></p>
        <p class="joined" id="pJoined"></p>
        <p class="stats">
          <span><b id="pFollowing">0</b> Following</span>
          <span><b id="pFollowers">0</b> Followers</span>
          <span><b id="pPosts">0</b> Posts</span>
        </p>
      </section>

      <div class="feed" id="feed" aria-live="polite"></div>
    </main>

    <!-- Right: suggestions -->
    <aside class="side-right">
      <section class="card">
        <h2>Who to follow</h2>
        <div id="suggestions"></div>
      </section>
      <section class="card card-note">
        <h2>No algorithm here</h2>
        <p>Posts show up in the order they were written. Nothing is boosted, nothing is hidden, and there are no ads between them.</p>
      </section>
      <footer class="side-footer">
        <a href="#">Terms of Service</a>
        <a href="#">Privacy Policy</a>
        <span>© 2026 LookBlog</span>
      </footer>
    </aside>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="eyes.js"></script>
  <script src="home.js"></script>
</body>
</html>
